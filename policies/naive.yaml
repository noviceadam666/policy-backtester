# Naive: catches the incidents, breaks the nightly cleanup and the release job.
rules:
  - id: no-rm-rf
    tool: terminal
    command: 'rm\s+-rf'
    action: block
    message: Recursive deletes are blocked.
  - id: no-force-push
    tool: terminal
    command: 'git\s+push\s+(-f|--force)'
    action: block
    message: Force-push is blocked.
  - id: no-secret-reads
    tool: [read_file, terminal]
    path: ['**/.env', '**/config/vendor-api.yaml', '**/*.pem', '~/.ssh/**']
    action: block
    message: Secret files are off limits.
  - id: no-shell-uploads
    tool: terminal
    command: '(curl|wget)\s(?:(?:(?!(?:curl|wget)\s)[^|;&\n]|\\\n)*\s)?(-d|--data|-F|--form|-T|--upload-file|--post-data|--post-file)'
    action: block
    message: Uploads from the shell are blocked.
